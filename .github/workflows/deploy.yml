# Build und Deploy auf GitHub Pages (H).
# - bei jedem Push auf main und von Hand (Actions → „Build und Deploy“ → „Run workflow“)
# - montags früh: hält „Geschlossen an diesen Tagen“ und die Feiertage im JSON-LD aktuell
#   (beides wird beim Build aus oeffnungszeiten.json berechnet)
name: Build und Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests (Übersetzungen, Title/Description, Zeiten, Inhaltsregeln)
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests der Edge Function
        working-directory: supabase/functions/anfrage
        run: deno test lib.test.ts

      # Adresse und Basis-Pfad kommen von GitHub Pages: ohne eigene Domain
      # https://<konto>.github.io/<repo>/, mit eigener Domain die Wurzel.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build (mit Prüfung des fertigen Builds)
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_FORM_URL: ${{ vars.PUBLIC_FORM_URL }}
          # Vorschau (noindex, robots.txt sperrt), bis die Repository-Variable LIVE auf true steht
          PUBLIC_VORSCHAU: ${{ vars.LIVE == 'true' && '0' || '1' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
